name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # Optional repository variable; the deploy script defaults to iamgarvit/wifi-doctor.
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - name: Skip when HF_TOKEN is not configured
        if: env.HF_TOKEN == ''
        run: echo "HF_TOKEN secret is not set; skipping the Space sync."

      - uses: actions/checkout@v4
        if: env.HF_TOKEN != ''

      - uses: actions/setup-python@v5
        if: env.HF_TOKEN != ''
        with:
          python-version: "3.12"

      # The Hub rejects plain-git pushes of binary files (the results PNGs), so
      # sync through the Hub API rather than `git push`. The Space's
      # GEMINI_API_KEY secret is left as it is: it is not passed in here.
      - name: Upload to the Space
        if: env.HF_TOKEN != ''
        run: |
          pip install huggingface_hub
          python scripts/deploy_space.py --no-wait
