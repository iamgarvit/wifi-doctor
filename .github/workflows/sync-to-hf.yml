name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Space is a git repo of its own; a full history avoids a
          # non-fast-forward push on the first sync.
          fetch-depth: 0
          lfs: true

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # e.g. "garvit/wifi-doctor" -- set as a repository variable.
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN secret or HF_SPACE variable is not set; skipping sync."
            exit 0
          fi
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main:main
